joy_node:
  dev: /dev/input/by-id/usb-ShanWan_Xbox360_For_Windows_10F36D6-joystick
  deadzone: 0.05
  autorepeat_rate: 20.0
  coalesce_interval: 0.001
  default_trig_val: true

joystick_teleop_node:
  joy_topic: /joy
  command_topic: /vehicle/manual_command
  steering_axis: 0
  brake_axis: 2
  accel_axis: 5
  steering_inverted: false
  brake_inverted: true
  accel_inverted: true
  steering_deadzone: 0.05
  steering_scale: 1.0
  steering_expo: 0.7
  status_topic: /vehicle/status
  status_timeout: 0.5
  odometry_topic: /localization/odometry
  odometry_timeout: 0.5
  maximum_gear_change_speed_mps: 0.5
  allow_brake_interlock_without_status: true
  minimum_brake_for_gear_change: 0.5
  maximum_accel_for_gear_change: 0.05
  initial_gear: 4
  drive_button: 0
  neutral_button: 1
  reverse_button: 2
  park_button: 3
  reset_topic: /vehicle/reset_request
  reset_button: 8

morai_vehicle_status_udp_node:
  listen_ip: 0.0.0.0
  listen_port: 9094
  status_topic: /vehicle/status
  poll_rate: 200.0

morai_sim_reset_node:
  reset_topic: /vehicle/reset_request
  window_name: Simulator
  reset_key: i
  control_toggle_key: q
  focus_delay: 0.2
  key_hold: 0.01
  reset_key_hold: 0.12
  mode_settle: 0.25
  builtin_settle: 0.0001
  reset_settle: 0.1

morai_udp_sender_node:
  command_topic: /vehicle/manual_command
  destination_ip: 127.0.0.1
  destination_port: 9093
  send_rate: 50.0
  command_timeout: 0.25
  safe_brake: 0.5
  reset_topic: /vehicle/reset_request
  reset_pause_duration: 0.9
